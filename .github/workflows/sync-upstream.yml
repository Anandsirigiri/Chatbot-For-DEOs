name: Sync Upstream
on:
  schedule:
    - cron: '0 * * * *' # Runs every hour as backup
  workflow_dispatch: # Allows manual triggering from GitHub UI
  repository_dispatch: # Allows external webhook triggers

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: develop # Your branch
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/Anandsirigiri/Chatbot-For-DEOs.git
          git fetch upstream

      - name: Sync Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Try to merge, if conflict occurs, abort and skip gracefully
          if git merge upstream/main-latest --no-edit; then
            echo "✅ Merge successful"
            git push origin develop
          else
            echo "⚠️ Merge conflict detected - skipping sync"
            git merge --abort
            echo "Manual intervention required to resolve conflicts"
            exit 0
          fi
